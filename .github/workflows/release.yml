name: Build and Release

# Push a tag like v1.1.0 to build every platform and publish a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            asset: SharkPad-Windows.zip
          - name: Linux
            os: ubuntu-22.04
            asset: SharkPad-Linux-x86_64.AppImage
          - name: macOS Apple Silicon
            os: macos-latest
            asset: SharkPad-Mac-AppleSilicon.zip
          - name: macOS Intel
            os: macos-15-intel
            asset: SharkPad-Mac-Intel.zip

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyAudio builds against PortAudio on macOS and Linux
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2

      - name: Install system libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Build
        run: python build.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SharkPad.exe -DestinationPath ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=dist/SharkPad.app
          # Dictation needs microphone access, which macOS only grants if the app says why
          plutil -insert NSMicrophoneUsageDescription -string "SharkPad uses the microphone for voice dictation." "$APP/Contents/Info.plist"
          # Editing Info.plist breaks the signature, so re-sign (ad-hoc)
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" ${{ matrix.asset }}

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/SharkPad AppDir/usr/bin/SharkPad
          cp shark_pad_icon.png AppDir/sharkpad.png
          cat > AppDir/sharkpad.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=SharkPad
          Comment=Notes, drawing, and voice dictation in one window
          Exec=SharkPad
          Icon=sharkpad
          Categories=Office;Education;
          EOF
          sed -i 's/^ *//' AppDir/sharkpad.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/SharkPad" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/SharkPad
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: SharkPad ${{ github.ref_name }}
          files: assets/*
          generate_release_notes: true
