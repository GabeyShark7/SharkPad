name: Linux Smoke Test

on:
  push:
    branches: [linux-smoke-test]

jobs:
  smoke:
    name: ${{ matrix.mode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        mode: [appimage, source]

    steps:
      - uses: actions/checkout@v4

      - name: Install desktop libraries and a virtual screen
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick portaudio19-dev libegl1 libgl1 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libdbus-1-3 libfontconfig1
          if [ "${{ matrix.os }}" = "ubuntu-24.04" ]; then sudo apt-get install -y libfuse2t64; else sudo apt-get install -y libfuse2; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow
          echo "APP_CMD=python main.py" >> $GITHUB_ENV

      # Same build + packaging steps as release.yml, but from this commit
      - name: Build AppImage from the latest code
        if: matrix.mode == 'appimage'
        run: |
          python build.py
          mkdir -p AppDir/usr/bin
          cp dist/SharkPad AppDir/usr/bin/SharkPad
          cp shark_pad_icon.png AppDir/sharkpad.png
          printf '[Desktop Entry]\nType=Application\nName=SharkPad\nExec=SharkPad\nIcon=sharkpad\nCategories=Office;Education;\n' > AppDir/sharkpad.desktop
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/SharkPad" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun AppDir/usr/bin/SharkPad
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool AppDir SharkPad-Linux-x86_64.AppImage
          echo "APP_CMD=./SharkPad-Linux-x86_64.AppImage" >> $GITHUB_ENV

      - name: Launch SharkPad and take screenshots
        run: |
          Xvfb :99 -screen 0 1600x1000x24 &
          export DISPLAY=:99
          sleep 3
          $APP_CMD > app.log 2>&1 &
          PID=$!
          sleep 8
          import -window root shot-1-startup.png
          sleep 22
          import -window root shot-2-after-30s.png
          echo "----- app output -----"
          cat app.log
          echo "----------------------"
          if kill -0 $PID 2>/dev/null; then
            echo "SharkPad is still running after 30s"
            kill $PID
          else
            wait $PID; CODE=$?
            echo "SharkPad exited early with code $CODE"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.mode }}-${{ matrix.os }}
          path: |
            *.png
            app.log
